name: build

# Only your own pushes run this. Pull requests never trigger it.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  SDK_URL: https://files.nordicsemi.com/artifactory/nRF5-SDK/external/nRF51_SDK_v10.x.x/nRF51_SDK_10.0.0_dc26b5e.zip
  SDK_SHA256: 2c1a0ba191f5fde020487e1e86c4dc2df28daed7986e916e40b2583a2fd16397

jobs:
  build:
    runs-on: ubuntu-24.04
    # Same distro and toolchain (arm-none-eabi-gcc 14.2.rel1) the release was
    # built and tested with, so CI reproduces it byte for byte.
    container: ubuntu:26.04
    steps:
      - name: Toolchain
        run: |
          apt-get update -q
          apt-get install -yq --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi gcc libc6-dev make python3 git curl unzip ca-certificates

      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: nRF51 SDK 10.0.0
        run: |
          curl -sSLo sdk.zip "$SDK_URL"
          echo "$SDK_SHA256  sdk.zip" | sha256sum -c
          unzip -q sdk.zip -d "$RUNNER_TEMP/nrf_sdk"

      - name: Build and check
        run: NRF_SDK="$RUNNER_TEMP/nrf_sdk" tools/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - name: Assemble test page
        run: |
          mkdir -p site/fw_images/gamepad
          cp tools/web/test.html site/index.html
          cp tools/web/test.html site/test.html
          cp dist/build.json site/fw_images/gamepad/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
